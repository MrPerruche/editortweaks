[package]
name = "editortweaks"
description = "Brick Rigs vehicle editor improvements (brickworks native mod)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Loaded by the brickworks loader via LoadLibrary; it only needs the C exports `mod_info`/`mod_init`.
crate-type = ["cdylib"]

[dependencies]
brickrust.workspace = true
brickworks.workspace = true
model_io = { path = "../model_io" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
